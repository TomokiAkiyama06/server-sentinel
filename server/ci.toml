version = 1

[checks]
lint = ["python", "-m", "tests.lint"]
# Issue #248: a soft and hard limit of 1024 descriptors (a common Ubuntu
# default), so a held-descriptor leak fails here; exec keeps SIGABRT on timeout
# reaching Python's faulthandler.
test = ["sh", "-c", "ulimit -n 1024 && exec python -m unittest discover -s tests -p 'test_*.py' -v"]

[smoke]
dockerfile = "Dockerfile.ci"
normal = ["python", "-m", "tests.smoke", "normal"]
error = ["python", "-m", "tests.smoke", "error"]
