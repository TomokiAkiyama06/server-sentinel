name: Claude PRレビュー

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

# 同じPRへpushされた場合、古いレビューrunは可能な限りキャンセルする。
# それでも投稿直前の競合は起こり得るため、下記helperでもHEADを再確認する。
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # fork PR では repository secret が渡らないため、この自動経路は同一repository内PR専用。
    # fork PR は claude-review-fork.yml の信頼済み手動経路を使う。
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: レビュー対象HEADを固定
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR番号が不正です: $PR_NUMBER" >&2
            exit 1
          fi
          if ! [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR/base SHAを安全に取得できませんでした。" >&2
            exit 1
          fi

          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$current_head" != "$EVENT_HEAD_SHA" ]; then
            echo "workflow開始時点でPR HEADがevent SHAから変わっています: $EVENT_HEAD_SHA -> $current_head。最新eventのrunを使用してください。" >&2
            exit 1
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "PR_HEAD_SHA=$EVENT_HEAD_SHA" >> "$GITHUB_ENV"
          echo "PR_BASE_SHA=$EVENT_BASE_SHA" >> "$GITHUB_ENV"
          echo "PR #$PR_NUMBER のHEAD $EVENT_HEAD_SHA をレビュー対象として固定します。"

      - name: 固定HEADをチェックアウト
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 固定diffと安全な投稿helperを準備
        run: |
          set -euo pipefail

          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$current_head" != "$PR_HEAD_SHA" ]; then
            echo "レビュー準備中にPR HEADが変更されました: $PR_HEAD_SHA -> $current_head。" >&2
            exit 1
          fi

          git cat-file -e "$PR_BASE_SHA^{commit}"
          git cat-file -e "$PR_HEAD_SHA^{commit}"

          mkdir -p .claude-review
          git diff --no-ext-diff "$PR_BASE_SHA...$PR_HEAD_SHA" > .claude-review/pinned-pr.diff

          cat > .claude-review/post-review.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          review_file="${1:-.claude-review/review.md}"
          if [ ! -s "$review_file" ]; then
            echo "Claudeレビュー本文が空または存在しません: $review_file" >&2
            exit 1
          fi

          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$current_head" != "$PR_HEAD_SHA" ]; then
            echo "レビュー投稿直前にPR HEADが変更されました: $PR_HEAD_SHA -> $current_head。投稿しません。" >&2
            exit 1
          fi

          payload="$(mktemp)"
          {
            echo "<!-- claude-reviewed-head:$PR_HEAD_SHA -->"
            echo "### Claude PRレビュー"
            echo
            echo "**レビュー対象HEAD:** \`$PR_HEAD_SHA\`"
            echo
            cat "$review_file"
          } > "$payload"

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$payload"
          rm -f "$payload"
          SCRIPT
          chmod 700 .claude-review/post-review.sh

          # diff生成後にもHEADが同じことを確認する。
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$current_head" != "$PR_HEAD_SHA" ]; then
            echo "diff固定中にPR HEADが変更されました: $PR_HEAD_SHA -> $current_head。" >&2
            exit 1
          fi

      - name: Claudeで固定HEADをレビュー
        id: claude
        # v1.0.223 相当。mutableな @v1 ではなく検証したfull commit SHAへ固定する。
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: false
          include_fix_links: false
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}
            PINNED HEAD SHA: ${{ env.PR_HEAD_SHA }}
            PINNED BASE SHA: ${{ env.PR_BASE_SHA }}
            PINNED DIFF FILE: .claude-review/pinned-pr.diff

            ServerSentinel のプルリクエストをレビューしてください。
            **レビュー対象は上記PINNED HEAD SHAだけです。** 現在の作業ディレクトリもそのSHAへ固定済みです。
            liveな `gh pr diff` / `gh pr view` を使ってレビュー対象を取り直してはいけません。変更差分は `.claude-review/pinned-pr.diff` を確認してください。

            出力は原則として日本語にしてください。
            コード、識別子、API名、ライブラリ名などの技術用語は英語のままで構いません。

            必ず AGENTS.md、REQUIREMENTS.md、SPECIFICATION.md、SECURITY.md、PRIVACY.md を関連範囲で確認し、固定済みPR差分がそれらに反していないか確認してください。

            特に以下を重点的に確認してください。
            - 仕様・受け入れ条件との整合性
            - バグ、境界条件、エラー処理、再接続・再試行
            - セキュリティ、認証、Secret、パストラバーサル等
            - プライバシー方針と「開発者クラウドなし」の不変条件
            - データ破壊、録画保持、容量枯渇時の安全性
            - 並行処理、冪等性、競合状態
            - テスト不足と実機確認の切り分け
            - 依存関係、モデル、weights のライセンス
            - iOS / Ubuntu / Web 間の契約不整合
            - App Store審査上の問題
            - 不要な複雑化や保守性低下

            指摘は重要度を「重大」「重要」「提案」に分類し、具体的なファイル・箇所・理由・修正案を示してください。
            重大または重要な問題がない場合は、その旨を明示してください。
            既に別レビューで指摘・修正済みの内容を重複して指摘する場合は、PINNED HEADでも問題が残っていることを確認してください。

            GitHubへ直接コメントしないでください。inline commentも作成しません。
            最終レビュー本文だけを `.claude-review/review.md` にWriteしてください。
            書き込み後、**必ず最後に** `./.claude-review/post-review.sh .claude-review/review.md` を実行してください。
            このhelperが投稿直前にPR HEADを再確認し、PINNED HEADと一致するときだけ、対象SHAを明記した正式レビューコメントを投稿します。
            コード変更・コミット・push・mergeは行わないでください。

          claude_args: |
            --allowedTools "Read,Glob,Grep,Write,Bash(./.claude-review/post-review.sh:*)"

      - name: レビューgateを検証
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ] || [ -z "${PR_HEAD_SHA:-}" ]; then
            echo "固定HEAD情報がないためレビューを有効扱いできません。" >&2
            exit 1
          fi

          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$current_head" != "$PR_HEAD_SHA" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "⚠️ Claudeレビューは無効です。レビュー実行中にPR HEADが \`$PR_HEAD_SHA\` から \`$current_head\` へ変更されました。最新HEADのworkflowを使用してください。"
            echo "レビュー中にPR HEADが変更されました。" >&2
            exit 1
          fi

          if [ "$CLAUDE_OUTCOME" != "success" ]; then
            echo "Claudeレビュー自体が成功していないため、このHEADのレビューgateは未完了です。" >&2
            exit 1
          fi

          marker="<!-- claude-reviewed-head:$PR_HEAD_SHA -->"
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[].body' | grep -Fq "$marker"; then
            echo "現在のHEADに固定された正式Claudeレビューコメントが見つかりません。" >&2
            exit 1
          fi

          echo "ClaudeレビューはPR HEAD $PR_HEAD_SHA に固定され、投稿直前・完了時とも同一HEADであることを確認しました。"
