name: Claude PRレビュー

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude-review:
    # fork PR では repository secret が渡らないため、この自動経路は同一repository内PR専用。
    # fork PR は claude-review-fork.yml の信頼済み手動経路を使う。
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: ClaudeでPRをレビュー
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ServerSentinel のプルリクエストをレビューしてください。
            出力・GitHubへのコメントは原則として日本語にしてください。
            コード、識別子、API名、ライブラリ名などの技術用語は英語のままで構いません。

            必ず AGENTS.md、REQUIREMENTS.md、SPECIFICATION.md、SECURITY.md、PRIVACY.md を関連範囲で確認し、PRの変更がそれらに反していないか確認してください。

            特に以下を重点的に確認してください。
            - 仕様・受け入れ条件との整合性
            - バグ、境界条件、エラー処理、再接続・再試行
            - セキュリティ、認証、Secret、パストラバーサル等
            - プライバシー方針と「開発者クラウドなし」の不変条件
            - データ破壊、録画保持、容量枯渇時の安全性
            - 並行処理、冪等性、競合状態
            - テスト不足と実機確認の切り分け
            - 依存関係、モデル、weights のライセンス
            - iOS / Ubuntu / Web 間の契約不整合
            - App Store審査上の問題
            - 不要な複雑化や保守性低下

            指摘は重要度を「重大」「重要」「提案」に分類し、具体的なファイル・箇所・理由・修正案を示してください。
            重大または重要な問題がない場合は、その旨を明示してください。
            既に別レビューで指摘・修正済みの内容を重複して指摘する場合は、現HEADでも問題が残っていることを確認してください。

            PRブランチは現在の作業ディレクトリにチェックアウト済みです。
            全体コメントには `gh pr comment` を使用し、特定行の問題には `mcp__github_inline_comment__create_inline_comment` を使用してください。
            GitHub上へのレビューコメントのみを投稿し、コード変更・コミット・マージは行わないでください。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*)"
