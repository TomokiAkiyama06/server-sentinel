name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository guards and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Scan tracked files and synthetic provenance
        run: python scripts/ci/repository_guard.py
      - name: Validate dependency and model license inventory
        run: python scripts/ci/license_gate.py
      - name: Install hash-pinned CI tools
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .ci/requirements.txt
      - name: Verify resolved Python pins against reviewed evidence
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m venv "${RUNNER_TEMP}/pin-check"
          "${RUNNER_TEMP}/pin-check/bin/python" -m pip install --require-hashes \
            --only-binary=:all: --no-cache-dir \
            --report "${RUNNER_TEMP}/pip-report.json" -r .ci/requirements.txt
          python scripts/ci/license_gate.py \
            --resolved-python "${RUNNER_TEMP}/pip-report.json" --input .ci/requirements.txt
      - name: Python lint
        run: |
          python -m pyflakes scripts tests
          python -m pycodestyle --select=E4,E7,E9 scripts tests
      - name: Synthetic guard and component regression tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Install hash-pinned Main runtime dependencies for guarded E2E entry points
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-cache-dir \
            --report "${RUNNER_TEMP}/server-runtime-report.json" -r server/requirements.lock
          python scripts/ci/license_gate.py \
            --resolved-python "${RUNNER_TEMP}/server-runtime-report.json" \
            --input server/requirements.lock
      - name: Two-account CA key separation as root (Issue #109)
        # The only root step: two unused numeric accounts stand for
        # serversentinel-ca and the service account (no account is created).
        # A copy under a traversable temporary directory lets those accounts
        # import the code after the drop; the test fails instead of skipping.
        run: |
          workdir="$(mktemp -d)"
          cp -R server "$workdir/server"
          chmod -R a+rX "$workdir"
          cd "$workdir/server"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 CA_SEPARATION_REQUIRE_ROOT=1 \
            "$(command -v python)" -m unittest -v tests.test_ca_privilege_separation_root
      - name: Hardware-free mock E2E core scenarios
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: server:agent:.
          E2E_REQUIRE_FULL_COVERAGE: '1'
        run: python -m unittest tests.e2e.test_mock_core_harness -v
      - name: Hardware-free mock E2E storage, retention, notification, access, pairing, detection isolation, telemetry, capture mTLS and enrollment scenarios
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: server:agent:.
          E2E_REQUIRE_FULL_COVERAGE: '1'
        run: >-
          python -m unittest -v
          tests.e2e.test_agent_ring_scenarios
          tests.e2e.test_agent_storage_scenarios
          tests.e2e.test_retention_scenarios
          tests.e2e.test_notification_fault_scenarios
          tests.e2e.test_access_matrix_scenarios
          tests.e2e.test_pairing_scenarios
          tests.e2e.test_detection_isolation_scenarios
          tests.e2e.test_no_telemetry_scenarios
          tests.e2e.test_capture_mtls_scenarios
          tests.e2e.test_capture_enrollment_scenarios
      - name: Whitespace validation
        run: git diff --check HEAD^ HEAD

  components:
    name: Conditional component checks
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run configured lint, tests, Docker, Compose and isolated smoke checks
        run: python scripts/ci/component_checks.py
      - name: Scan available component build output
        run: python scripts/ci/repository_guard.py

  agent-ring-sqlite-340:
    name: Agent ring ledger on Debian 12 SQLite 3.40
    # Issue #191: SQLite 3.40.x (Debian 12 / Raspberry Pi OS bookworm) behaves
    # differently from Ubuntu 24.04's 3.45. The pinned Debian 12 smoke image
    # runs the dependency-free ring ledger restart tests with networking disabled.
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the pinned Debian 12 Agent image
        run: docker build --file agent/Dockerfile.ci --tag agent-sqlite-340 agent
      - name: Run ring ledger tests against the image's system SQLite
        run: |
          docker run --rm --pull=never --network=none agent-sqlite-340 \
            python -c 'import sqlite3, sys; print(sqlite3.sqlite_version); sys.exit(not sqlite3.sqlite_version.startswith("3.40."))'
          docker run --rm --pull=never --network=none agent-sqlite-340 \
            python -m unittest -v tests.test_ring

  web-browser:
    name: Dashboard browser smoke
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies and build local assets
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify resolved npm pins against reviewed evidence
        run: |
          python3 scripts/ci/license_gate.py \
            --resolved-npm web/node_modules/.package-lock.json --input web/package-lock.json
      - name: Synthetic viewport and browser request interception
        working-directory: web
        run: npm run test:browser

  ci:
    name: CI
    if: ${{ always() }}
    needs: [repository, components, web-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          COMPONENT_RESULT: ${{ needs.components.result }}
          WEB_BROWSER_RESULT: ${{ needs.web-browser.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$COMPONENT_RESULT" = success
          test "$WEB_BROWSER_RESULT" = success
